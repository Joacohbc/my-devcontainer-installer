# goreleaser config for the Go devcontainer CLI.
# Produces one raw binary per target named devcontainer-cli-<triplet>[.exe]
# plus a per-binary <name>.sha256 checksum file. This naming is a contract
# shared with install.sh, install.ps1 and the upgrade-cli self-updater
# (getTargetTriplet); changing it here means changing all of those too.
version: 2

project_name: devcontainer-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: devcontainer-cli
    main: ./cmd/devcontainer-cli
    binary: devcontainer-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: '{{ .CommitTimestamp }}'

# Ship raw binaries (no tar/zip), matching the release-asset contract.
archives:
  - id: devcontainer-cli
    formats:
      - binary
    name_template: >-
      {{ .ProjectName }}-{{ .Os }}-{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}

# One checksum file per artifact: <artifact>.sha256 (sha256sum format).
checksum:
  algorithm: sha256
  split: true

release:
  draft: false
  # `auto` marks tags with a SemVer pre-release segment (e.g. v1.4.0-vt.1) as
  # GitHub pre-releases. NOTE: this is only the value GoReleaser writes while
  # publishing — the CLI Release workflow re-applies the pre-release checkbox
  # set in the GitHub UI afterwards, so that manual flag is the real source of
  # truth. upgrade-cli treats pre-releases as opt-in and defaults to stable.
  prerelease: auto

changelog:
  use: github
