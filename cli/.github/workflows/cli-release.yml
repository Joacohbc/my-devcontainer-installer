name: CLI Validation and Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PREFIX: devcontainer

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: node-bun-java
            modules: nodejs,bun,java-temurin
            description: "Node + Bun + Java"
          - name: node-bun-python
            modules: nodejs,bun,python
            description: "Node + Bun + Python"
          - name: node-bun-go
            modules: nodejs,bun,go
            description: "Node + Bun + Go"
          - name: go-only
            modules: go
            description: "Go only"
          - name: python-only
            modules: python
            description: "Python only"
          - name: all
            modules: nodejs,bun,python,go,java-temurin,github-cli,dod,dbclients,ai-clis,sqlite,pnpm
            description: "ALL"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build CLI
        run: pnpm run build

      - name: Run Tests
        run: pnpm run test

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME_PREFIX }}-${{ matrix.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Generate Dockerfile
        run: |
          node dist/index.js --no-interactive \
            --with ${{ matrix.modules }} \
            --image ${{ steps.meta.outputs.tags }} \
            --no-build

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.description=Devcontainer with ${{ matrix.description }}
