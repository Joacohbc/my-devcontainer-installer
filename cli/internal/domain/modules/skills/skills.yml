categories:
  - id: core-agents
    label: "Core Agent Tools (discovery, browser automation)"
    skills:
      - find-skills
      - agent-browser

  - id: frontend-ux-design
    label: "Frontend & UI/UX Design (components, design tokens, styling, generative art)"
    skills:
      - frontend-design
      - ui-ux-pro-max
      - impeccable
      - web-artifacts-builder
      - theme-factory
      - algorithmic-art

  - id: docs-content
    label: "Docs & Content (canvas, office formats: docx, pdf, pptx, xlsx)"
    skills:
      - canvas-design
      - docx
      - pdf
      - pptx
      - xlsx

skills:
  # Core Agents
  - id: find-skills
    label: "Find Skills (agent skill discovery & installer)"
    ref: "vercel-labs/skills"
    skill: "find-skills"
    requires_modules:
      - nodejs
    category: "core-agents"
    description: >
      Discover, search, and install agent skills on demand.

  - id: agent-browser
    label: "Agent Browser (browser automation CLI for AI agents)"
    ref: "vercel-labs/agent-browser"
    requires_modules:
      - nodejs
    category: "core-agents"
    description: >
      Browser automation CLI for AI agents to navigate pages, fill forms, and take screenshots.

  # Frontend & UX Design
  - id: frontend-design
    label: "Frontend Design (production-grade distinctive UI generation)"
    ref: "anthropics/skills"
    skill: "frontend-design"
    requires_modules:
      - nodejs
    category: "frontend-ux-design"
    description: >
      Create distinctive, production-grade frontend interfaces with high design quality.

  - id: ui-ux-pro-max
    label: "UI/UX Pro Max (design intelligence, 84 styles, 192 palettes)"
    ref: "nextlevelbuilder/ui-ux-pro-max-skill"
    skill: "ui-ux-pro-max"
    requires_modules:
      - nodejs
    category: "frontend-ux-design"
    description: >
      Design intelligence database covering 84 UI styles, 192 color palettes, and UX guidelines.

  - id: impeccable
    label: "Impeccable (frontend craft, design tokens & UI audit)"
    ref: "pbakaus/impeccable"
    requires_modules:
      - nodejs
    category: "frontend-ux-design"
    description: >
      Polish, critique, audit, and harden web UI with design token systems.

  - id: web-artifacts-builder
    label: "Web Artifacts Builder (interactive web artifact suites)"
    ref: "anthropics/skills"
    skill: "web-artifacts-builder"
    requires_modules:
      - nodejs
    category: "frontend-ux-design"
    description: >
      Build interactive, standalone web artifacts and components.

  - id: theme-factory
    label: "Theme Factory (color palettes & UI theme system generator)"
    ref: "anthropics/skills"
    skill: "theme-factory"
    requires_modules:
      - nodejs
    category: "frontend-ux-design"
    description: >
      Theme system generator and harmonious color palette synthesizer.

  - id: algorithmic-art
    label: "Algorithmic Art (generative procedural SVG & Canvas art)"
    ref: "anthropics/skills"
    skill: "algorithmic-art"
    requires_modules:
      - nodejs
    category: "frontend-ux-design"
    description: >
      Procedural and generative art algorithms for interactive graphics.

  # Docs & Content
  - id: canvas-design
    label: "Canvas Design (visual art and graphics generation)"
    ref: "anthropics/skills"
    skill: "canvas-design"
    requires_modules:
      - nodejs
    category: "docs-content"
    description: >
      Generate static visual art, posters, and canvas-based graphics.

  - id: docx
    label: "DOCX (Word document generator and editor)"
    ref: "anthropics/skills"
    skill: "docx"
    requires_modules:
      - nodejs
    category: "docs-content"

  - id: pdf
    label: "PDF (PDF document generation and extraction)"
    ref: "anthropics/skills"
    skill: "pdf"
    requires_modules:
      - nodejs
    category: "docs-content"

  - id: pptx
    label: "PPTX (PowerPoint slide presentation builder)"
    ref: "anthropics/skills"
    skill: "pptx"
    requires_modules:
      - nodejs
    category: "docs-content"

  - id: xlsx
    label: "XLSX (Excel spreadsheet creator and data processor)"
    ref: "anthropics/skills"
    skill: "xlsx"
    requires_modules:
      - nodejs
    category: "docs-content"
