# A repo-shipped profile for Android SDK, adb, and Gradle development.
#
# github-cli is listed first for the same reason every other built-in does it:
# its Dockerfile layer is shared with the cached devcontainer-base image.
id: android
label: Android & Gradle (Android SDK cmdline-tools, platform-tools/adb, build-tools, Java 17 Temurin, Gradle)
modules:
  - github-cli
  - java-temurin
ports:
  - "5554:5554"
  - "5555:5555"
scripts:
  - file: install-android-tools.sh
    when: build
