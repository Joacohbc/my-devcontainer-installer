services:
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - local-network
  devcontainer-ssh:
    image: devcontainer-ssh:local
    build: .
    container_name: devcontainer-ssh
    command: sleep infinity
    restart: unless-stopped
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - devcontainer_etc:/etc
      - devcontainer_root:/root
      - devcontainer_home:/home
    networks:
      - local-network
networks:
  local-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.25.0.0/24}
volumes:
  devcontainer_etc: null
  devcontainer_root: null
  devcontainer_home: null
