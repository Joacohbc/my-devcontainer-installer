services:
  devcontainer-ssh:
    image: ghcr.io/joacohbc/devcontainer-ssh
    container_name: devcontainer-ssh
    depends_on:
      - mongo
      - redis
      - postgres
    command: sleep infinity
    restart: unless-stopped
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - devcontainer_etc:/etc
      - devcontainer_root:/root
      - devcontainer_home:/home

    networks:
      - local-network

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - local-network

  mongo:
    image: mongo:8.0
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: devuser
      MONGO_INITDB_ROOT_PASSWORD: devpass
    volumes:
      - mongo_data:/data/db
    networks:
      - local-network

  redis:
    image: redis:7.4-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    networks:
      - local-network

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - local-network


networks:
  local-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.25.0.0/24}

volumes:
  mongo_data:
  redis_data:
  postgres_data:
  devcontainer_etc:
  devcontainer_root:
  devcontainer_home: