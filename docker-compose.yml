services:
  devcontainer-ssh:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devcontainer-ssh
    depends_on:
      - mysql
      - mongo
      - redis
      - postgres
    command: sleep infinity
    volumes:
      - .:/workspace
      # To disable Docker-outside-Docker, comment out the next line
      - /var/run/docker.sock:/var/run/docker.sock # Add Docker socket mount

    # For local mode (not bridge), comment out the 'local-network' section below
    # and uncomment the 'ports' section.
    # ports:
    #   - "2222:22" # Example: forward host port 2222 to container port 22 for SSH
    networks:
      default:
      # local-network is used for bridge (ipvlan) mode.
      # Comment this out if using local mode with forwardPorts (uncomment 'ports' above).
      local-network:
        ipv4_address: ${DEVCONTAINER_SSH_IP}

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: devdb
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass
    ports:
      - "3306:3306"
    volumes:
      - ${MOUNT_VOLUMES}/mysql:/var/lib/mysql  # Volumen para MySQL

  mongo:
    image: mongo:6.0
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: devuser
      MONGO_INITDB_ROOT_PASSWORD: devpass
    ports:
      - "27017:27017"
    volumes:
      - ${MOUNT_VOLUMES}/mongo:/data/db  # Volumen para MongoDB

  redis:
    image: redis:7.0
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ${MOUNT_VOLUMES}/redis:/data  # Volumen para Redis

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"
    volumes:
      - ${MOUNT_VOLUMES}/postgres:/var/lib/postgresql/data  # Volumen para PostgreSQL

networks:
  local-network:
    driver: ipvlan
    driver_opts:
      parent: eth0  # Reemplaza "eth0" con la interfaz real de tu PI
    ipam:
      config:
        - subnet: ${NETWORK_RANGE}
          gateway: ${GATEWAY_IP}