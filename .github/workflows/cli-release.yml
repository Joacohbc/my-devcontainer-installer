name: CLI Release

on:
  push:
    tags:
      # Matches both stable tags (v1.4.0) and testing builds (v1.4.0-vt.N).
      # GoReleaser's `prerelease: auto` flags the latter as a GitHub pre-release,
      # so `upgrade-cli` only offers them as an opt-in.
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: cli/go.sum

      - name: Run tests
        working-directory: cli
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
