name: CLI Release

on:
  # Runs when you publish a GitHub Release (from the UI or `gh release create`).
  # The pre-release checkbox you set there is the source of truth. GoReleaser
  # always rewrites the release's prerelease flag from the tag name (via
  # `prerelease: auto`), so the final step below re-applies the value you chose
  # in the UI (`github.event.release.prerelease`).
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: cli/go.sum

      - name: Run tests
        working-directory: cli
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GoReleaser overwrites the release's prerelease flag from the tag name.
      # Re-apply the value chosen in the GitHub UI so the manual checkbox wins.
      - name: Restore pre-release flag from the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release edit "${{ github.event.release.tag_name }}"
          --repo "${{ github.repository }}"
          --prerelease=${{ github.event.release.prerelease }}
