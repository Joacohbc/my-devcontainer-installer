name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'cli/**'
  schedule:
    - cron: '0 0 */7 * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── Build the shared base image once ──
  # Every variant's Dockerfile starts with the identical Base layers (FROM
  # ubuntu, apt install, useradd devuser, zsh). We build a base image using the
  # "base" profile (always-on base + cleanup + GitHub CLI + Zellij) and publish it
  # with an inline cache so the variant builds below can `cache-from` it and
  # skip rebuilding those shared layers. This is not a RemoteVariant — it's a
  # cache/base image only.
  build-base-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: cli/go.sum

      - name: Build CLI
        working-directory: cli
        run: go build -o devcontainer-cli ./cmd/devcontainer-cli

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare environment variables
        run: |
          echo "REPO_OWNER=${OWNER,,}" >>${GITHUB_ENV}
          echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
        env:
          OWNER: '${{ github.repository_owner }}'
          GITHUB_SHA: '${{ github.sha }}'

      - name: Generate base Dockerfile
        run: |
          ./cli/devcontainer-cli --no-interactive --force \
            --workspace devcontainer \
            --profile base \
            --image ghcr.io/${{ env.REPO_OWNER }}/devcontainer-base:latest \
            --no-build

      # No build-args are passed, so the Dockerfile's USER_UID/USER_GID default
      # to 1000: prebuilt remote images bake devuser at UID 1000 and rely on the
      # entrypoint's runtime remap for hosts whose UID differs.
      - name: Build and push base image
        uses: docker/build-push-action@v7
        with:
          context: .dc_devcontainer/build
          push: true
          platforms: linux/amd64,linux/arm64
          cache-to: type=inline
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/devcontainer-base:latest
            ghcr.io/${{ env.REPO_OWNER }}/devcontainer-base:${{ env.SHORT_SHA }}-${{ env.TIMESTAMP }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Shared base image (Ubuntu + devuser + zsh + GitHub CLI + Zellij) for devcontainer variants

  # ── Build CLI-generated devcontainer variants ──
  build-variants:
    needs: build-base-cache
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nodejs
            description: "Node.js only"
          - name: bun
            description: "Bun only"
          - name: java-temurin
            description: "Java Temurin only"
          - name: python
            description: "Python only"
          - name: go
            description: "Go only"
          - name: node-go
            description: "Node.js + Go"
          - name: node-python
            description: "Node.js + Python"
          - name: node-java-temurin
            description: "Node.js + Java Temurin"
          - name: bun-go
            description: "Bun + Go"
          - name: bun-python
            description: "Bun + Python"
          - name: bun-java-temurin
            description: "Bun + Java Temurin"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: cli/go.sum

      - name: Build CLI
        working-directory: cli
        run: go build -o devcontainer-cli ./cmd/devcontainer-cli

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare environment variables
        run: |
          echo "REPO_OWNER=${OWNER,,}" >>${GITHUB_ENV}
          echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
        env:
          OWNER: '${{ github.repository_owner }}'
          GITHUB_SHA: '${{ github.sha }}'

      - name: Generate Dockerfile
        run: |
          ./cli/devcontainer-cli --no-interactive --force \
            --workspace devcontainer \
            --profile ${{ matrix.name }} \
            --image ghcr.io/${{ env.REPO_OWNER }}/devcontainer-${{ matrix.name }}:latest \
            --no-build

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .dc_devcontainer/build
          push: true
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=ghcr.io/${{ env.REPO_OWNER }}/devcontainer-base:latest
          cache-to: type=inline
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/devcontainer-${{ matrix.name }}:latest
            ghcr.io/${{ env.REPO_OWNER }}/devcontainer-${{ matrix.name }}:${{ env.SHORT_SHA }}-${{ env.TIMESTAMP }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Devcontainer with ${{ matrix.description }}
