name: Docker Image CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'cli/**'
  schedule:
    - cron: '0 0 */15 * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── Job 1: Build the full devcontainer-ssh image (all modules) ──
  build-base:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: cli/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: cli
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        working-directory: cli
        run: pnpm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare environment variables
        run: |
          echo "REPO_OWNER=${OWNER,,}" >>${GITHUB_ENV}
          echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
        env:
          OWNER: '${{ github.repository_owner }}'
          GITHUB_SHA: '${{ github.sha }}'

      - name: Generate full Dockerfile
        run: |
          node cli/dist/index.js --no-interactive --force \
            --workspace devcontainer \
            --with dod,java-temurin,python,go,sqlite,dbclients,bun,ai-clis,pnpm,nodejs,github-cli \
            --image ghcr.io/${{ env.REPO_OWNER }}/devcontainer-ssh:latest \
            --no-build

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .dc_devcontainer/build
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/devcontainer-ssh:latest
            ghcr.io/${{ env.REPO_OWNER }}/devcontainer-ssh:${{ env.SHORT_SHA }}-${{ env.TIMESTAMP }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Full devcontainer with all available modules

  # ── Job 2: Build CLI-generated devcontainer variants ──
  build-variants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nodejs
            modules: nodejs,pnpm,github-cli,ai-clis
            description: "Node.js only"
          - name: bun
            modules: bun,nodejs,pnpm,github-cli,ai-clis
            description: "Bun only"
          - name: java-temurin
            modules: java-temurin,nodejs,pnpm,github-cli,ai-clis
            description: "Java Temurin only"
          - name: python
            modules: python,nodejs,pnpm,github-cli,ai-clis
            description: "Python only"
          - name: go
            modules: go,nodejs,pnpm,github-cli,ai-clis
            description: "Go only"
          - name: node-go
            modules: nodejs,pnpm,go,github-cli,ai-clis
            description: "Node.js + Go"
          - name: node-python
            modules: nodejs,pnpm,python,github-cli,ai-clis
            description: "Node.js + Python"
          - name: node-java-temurin
            modules: nodejs,pnpm,java-temurin,github-cli,ai-clis
            description: "Node.js + Java Temurin"
          - name: bun-go
            modules: bun,nodejs,pnpm,go,github-cli,ai-clis
            description: "Bun + Go"
          - name: bun-python
            modules: bun,nodejs,pnpm,python,github-cli,ai-clis
            description: "Bun + Python"
          - name: bun-java-temurin
            modules: bun,nodejs,pnpm,java-temurin,github-cli,ai-clis
            description: "Bun + Java Temurin"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: cli/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: cli
        run: pnpm install --frozen-lockfile

      - name: Build CLI
        working-directory: cli
        run: pnpm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare environment variables
        run: |
          echo "REPO_OWNER=${OWNER,,}" >>${GITHUB_ENV}
          echo "SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
        env:
          OWNER: '${{ github.repository_owner }}'
          GITHUB_SHA: '${{ github.sha }}'

      - name: Generate Dockerfile
        run: |
          node cli/dist/index.js --no-interactive --force \
            --workspace devcontainer \
            --with ${{ matrix.modules }} \
            --image ghcr.io/${{ env.REPO_OWNER }}/devcontainer-${{ matrix.name }}:latest \
            --no-build

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .dc_devcontainer/build
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/devcontainer-${{ matrix.name }}:latest
            ghcr.io/${{ env.REPO_OWNER }}/devcontainer-${{ matrix.name }}:${{ env.SHORT_SHA }}-${{ env.TIMESTAMP }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Devcontainer with ${{ matrix.description }}
